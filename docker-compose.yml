version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stagecore_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-esports_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stagecore_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: stagecore_backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-esports_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - stagecore_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stagecore_frontend
    environment:
      - VITE_API_BASE_URL=https://api.yourdomain.com/api
      - VITE_WS_BASE_URL=wss://api.yourdomain.com/signaling
    ports:
      - "5173:80"
    networks:
      - stagecore_network

  nginx:
    image: nginx:alpine
    container_name: stagecore_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - stagecore_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email your-email@example.com -d yourdomain.com -d api.yourdomain.com --agree-tos

networks:
  stagecore_network:
    driver: bridge

volumes:
  pgdata:
